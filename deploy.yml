---
- name: Install python on hosts
  hosts: rancher
  remote_user: root
  # remote_user: azureuser
  # become: yes
  # become_method: sudo
  gather_facts: False

  tasks:
  - name: Install python on host
    raw: test -e /usr/bin/python3 || (apt -y update && apt install -y python3)
    register: output
    changed_when: output.stdout != ""

- name: Create a secure install then setup docker
  hosts: rancher
  remote_user: root
  # remote_user: azureuser
  # become: yes
  # become_method: sudo

  roles:
  - role: common
  - role: networking
  # - role: ufw
  - role: docker
    vars:
      # Find the matching docker_version for your target os & rancher release
      # https://www.suse.com/suse-rancher/support-matrix/all-supported-versions/
      docker_version: "5:27.0.*"  # rancher 2.11.1 / ubuntu 24.04
  - role: rancher
